    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    input, textarea, select, button { font-size: 16px !important; }
    @media (min-width: 640px) { input, textarea, select, button { font-size: 14px !important; } }
    
    /* Drag and drop styles */
    .draggable-feature {
      transition: all 0.2s ease;
    }
    .draggable-feature:active {
      cursor: grabbing !important;
    }
    .draggable-feature[draggable="true"] {
      cursor: grab;
    }
    
    /* Educational tooltip styles */
    .tooltip-container {
      position: relative;
      display: inline-block;
    }
    .tooltip-text {
      visibility: hidden;
      opacity: 0;
      width: 280px;
      background-color: #1f2937;
      color: #fff;
      text-align: left;
      border-radius: 6px;
      padding: 8px 10px;
      position: absolute;
      z-index: 100;
      bottom: 125%;
      left: 50%;
      margin-left: -140px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: opacity 0.2s, visibility 0.2s;
      pointer-events: none;
    }
    .tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #1f2937 transparent transparent transparent;
    }
    .tooltip-container:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
    .tooltip-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      background-color: #6366f1;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 14px;
      font-size: 10px;
      font-weight: bold;
      margin-left: 4px;

    function stripPatientIdentifiers() {
      // Return de-identified demographics
      const age = patientData.demographics.age || "adult";
      const sex = patientData.demographics.sex || "";
      return { age, sex };
    }

    function extractMedications() {
      if (!patientData.meds) return [];
      // Simple extraction - split by newlines and common separators
      return patientData.meds
        .split(/\n|,|;/)
        .map(m => m.trim())
        .filter(m => m.length > 0);
    }

    function extractDiagnoses() {
      const diagnoses = [];
      if (patientData.presentation) diagnoses.push(patientData.presentation);
      if (patientData.pmh) {
        // Extract from PMH
        patientData.pmh.split(/\n|,|;/).forEach(d => {
          const trimmed = d.trim();
          if (trimmed.length > 0) diagnoses.push(trimmed);
        });
      }
      return diagnoses;
    }

    function buildDrugInteractionQuery() {
      const report = generateReport();
      const deidentified = report.replace(patientData.demographics.name || '', '[Patient]');
      const meds = extractMedications();
      
      if (meds.length === 0) {
        return "No medications entered yet. Please add medications to check for interactions.";
      }

      return `.drug_interactions
Clinical Context:
${deidentified}`;
    }

    function buildClinicalQuery() {
      const report = generateReport();
      const deidentified = report.replace(patientData.demographics.name || '', '[Patient]');
      
      return `${deidentified}

What are the key considerations for management of this presentation?`;
    }

    function buildTreatmentVerificationQuery() {
      const report = generateReport();
      const deidentified = report.replace(patientData.demographics.name || '', '[Patient]');
      const diagnoses = extractDiagnoses();
      
      if (diagnoses.length === 0) {
        return "No diagnosis entered yet. Please add a presenting complaint or diagnosis.";
      }

      return `${deidentified}

Is this management plan evidence-based? Any important considerations or contraindications?`;
    }

    function buildRareDiagnosesQuery() {
      const report = generateReport();
      const deidentified = report.replace(patientData.demographics.name || '', '[Patient]');
      const diagnoses = extractDiagnoses();
      
      if (diagnoses.length === 0) {
        return "No diagnosis entered yet. Please add a presenting complaint or diagnosis.";
      }

      return `${deidentified}

What rare or uncommon diagnoses should be considered in the differential for this presentation? What red flags or unusual features would suggest these diagnoses?`;
    }

    function initializeDefaultCustomizations() {
      // SAFETY CHECK: Ensure customizations structure exists first
      if (!userPreferences.customizations) {
        userPreferences.customizations = { presentations: {}, ros: {}, exam: {}, customROS: [], customExam: [], customPresentations: [] };
      }
      if (!userPreferences.customizations.presentations) {
        userPreferences.customizations.presentations = {};
      }
      if (!userPreferences.customizations.ros) {
        userPreferences.customizations.ros = {};
      }
      if (!userPreferences.customizations.exam) {
        userPreferences.customizations.exam = {};
      }
      if (!userPreferences.customizations.customROS) {
        userPreferences.customizations.customROS = [];
      }
      if (!userPreferences.customizations.customExam) {
        userPreferences.customizations.customExam = [];
      }
      if (!userPreferences.customizations.customPresentations) {
        userPreferences.customizations.customPresentations = [];
      }
      if (!userPreferences.customizations.managementPlanTemplates) {
        userPreferences.customizations.managementPlanTemplates = {};
      }

      // Initialize customizations for all presentations with MASTER_FEATURES
      Object.keys(MASTER_FEATURES).forEach(presentation => {
        if (!userPreferences.customizations.presentations[presentation]) {
          // New presentation - create from scratch
          userPreferences.customizations.presentations[presentation] = {
            features: MASTER_FEATURES[presentation].map(f => ({
              ...f,
              visible: true,
              redFlag: f.redFlag || false  // Preserve redFlag from MASTER_FEATURES
            })),
            customFeatures: []
          };
        } else {
          // Existing presentation - merge new features from MASTER_FEATURES
          const existing = userPreferences.customizations.presentations[presentation];
          const existingKeys = new Set(existing.features.map(f => f.key));
          
          // Find features in MASTER_FEATURES that don't exist in user customizations
          const newFeatures = MASTER_FEATURES[presentation]
            .filter(masterFeature => !existingKeys.has(masterFeature.key))
            .map(f => ({
              ...f,
              visible: true,
              redFlag: f.redFlag || false
            }));
          
          // Add new features to the end
          if (newFeatures.length > 0) {
            existing.features.push(...newFeatures);
            console.log(`Added ${newFeatures.length} new features to ${presentation}`);
          }
        }
      });

      // Initialize ROS customizations
      ROS_SYSTEMS.forEach(([system, items]) => {
        items.forEach(([safe, unsafe]) => {
          const key = `ros_${safe}`;
          if (!userPreferences.customizations.ros[key]) {
            userPreferences.customizations.ros[key] = {
              visible: true,
              customSafe: null,
              customUnsafe: null,
              redFlag: false
            };
          }
        });
      });

      // Initialize Exam customizations
      Object.entries(EXAM_SECTIONS).forEach(([section, buttons]) => {
        buttons.forEach(btn => {
          if (!userPreferences.customizations.exam[btn.key]) {
            userPreferences.customizations.exam[btn.key] = {
              visible: true,
              customSafe: null,
              customUnsafe: null,
              redFlag: false
            };
          }
        });
      });
    }

    function getCustomizedFeatures(presentation) {
      // SAFETY: Ensure customizations exists
      if (!userPreferences || !userPreferences.customizations) {
        return MASTER_FEATURES[presentation] || [];
      }
      
      const custom = userPreferences.customizations.presentations?.[presentation];
      if (!custom) {
        // Check if it's a custom presentation
        const customPresentation = userPreferences.customizations.customPresentations?.find(cp => cp.name === presentation);
        if (customPresentation) {
          return (customPresentation.features || []).filter(f => f && f.visible !== false);
        }
        return MASTER_FEATURES[presentation] || [];
      }
      return [
        ...(custom.features || []).filter(f => f && f.visible !== false), 
        ...(custom.customFeatures || []).filter(f => f && f.visible !== false)
      ];
    }

    function getManagementPlanTemplate(diagnosis) {
      // Check if user has customized this template
      if (userPreferences?.customizations?.managementPlanTemplates?.[diagnosis]) {
        return userPreferences.customizations.managementPlanTemplates[diagnosis];

      // Otherwise return built-in template
      return MANAGEMENT_PLAN_TEMPLATES[diagnosis] || '';

    function getROSLabel(safe, unsafe, type = 'both') {
      const key = `ros_${safe}`;
      const custom = userPreferences.customizations.ros[key];
      if (!custom) return type === 'safe' ? safe : type === 'unsafe' ? unsafe : { safe, unsafe };
      
      const customSafe = custom.customSafe || safe;
      const customUnsafe = custom.customUnsafe || unsafe;
      return type === 'safe' ? customSafe : type === 'unsafe' ? customUnsafe : { safe: customSafe, unsafe: customUnsafe };
    }

    function getExamLabel(key, type) {
      const custom = userPreferences.customizations.exam[key];
      if (!custom) {
        const button = Object.values(EXAM_SECTIONS).flat().find(b => b.key === key);
        return button ? button[type] : '';
      }
      return type === 'safe' ? (custom.customSafe || EXAM_SECTIONS[Object.keys(EXAM_SECTIONS).find(sec => EXAM_SECTIONS[sec].some(b => b.key === key))].find(b => b.key === key).safe) :
                                (custom.customUnsafe || EXAM_SECTIONS[Object.keys(EXAM_SECTIONS).find(sec => EXAM_SECTIONS[sec].some(b => b.key === key))].find(b => b.key === key).unsafe);
    }

    function isItemVisible(category, key) {
      if (category === 'ros') {
        const custom = userPreferences.customizations.ros[key];
        return custom ? custom.visible : true;
      } else if (category === 'exam') {
        const custom = userPreferences.customizations.exam[key];
        return custom ? custom.visible : true;
      }
      return true;
    }

    function isRedFlag(category, key) {
      if (category === 'ros') {
        const custom = userPreferences.customizations.ros[key];
        return custom ? custom.redFlag : false;
      } else if (category === 'exam') {
        const custom = userPreferences.customizations.exam[key];
        return custom ? custom.redFlag : false;
      }
      return false;
    }

    function checkAndClearOldData() {
      const saved = localStorage.getItem('patients');
      if (!saved) {
        // Initialize with one empty patient
        patients = { 1: getEmptyPatientData() };
        currentPatientId = 1;
        patientData = patients[1];
        saveAllPatients();
        return;
      }
      
      try {
        const data = JSON.parse(saved);
        const today = new Date();
        
        // Check if any patient data is from a different day
        let hasOldData = false;
        Object.keys(data.patients || {}).forEach(patientId => {
          const patient = data.patients[patientId];
          if (patient.lastSaved) {
            const savedDate = new Date(patient.lastSaved);
            if (savedDate.toDateString() !== today.toDateString()) {
              hasOldData = true;
            }
          }
        });
        
        if (hasOldData) {
          console.log('New day detected - clearing all patient data');
          localStorage.removeItem('patients');
          patients = { 1: getEmptyPatientData() };
          currentPatientId = 1;
          patientData = patients[1];
          saveAllPatients();
        } else {
          // Load patient data from localStorage
          patients = data.patients || { 1: getEmptyPatientData() };
          currentPatientId = data.currentPatientId || 1;
          
          // Ensure current patient exists
          if (!patients[currentPatientId]) {
            currentPatientId = parseInt(Object.keys(patients)[0]) || 1;
          }
          
          patientData = patients[currentPatientId];
          
          // SAFETY CHECK: Ensure new fields exist for all patients (backward compatibility)
          Object.keys(patients).forEach(id => {
            const p = patients[id];
            if (!p.investigations) p.investigations = { urinalysis: "", bloods: "", ecg: "", imaging: "", other: "" };
            if (!p.investigation_toggles) p.investigation_toggles = {};
            if (!p.notes) p.notes = {};
            if (!p.differentials) p.differentials = {};
            if (!p.managementPlans) p.managementPlans = {};
            if (!p.createdAt) p.createdAt = new Date().toISOString();
          });
        }
      } catch (e) {
        console.error('Error loading patient data:', e);
        patients = { 1: getEmptyPatientData() };
        currentPatientId = 1;
        patientData = patients[1];
      }
    }

    function savePatientData() {
      patientData.lastSaved = new Date().toISOString();
      patients[currentPatientId] = patientData;
      saveAllPatients();
    }
    
    function saveAllPatients() {
      const data = {
        patients: patients,
        currentPatientId: currentPatientId
      };
      localStorage.setItem('patients', JSON.stringify(data));
    }

    function clearAllPatientData() {
      if (confirm('Clear ALL patient data (all ' + Object.keys(patients).length + ' patients)? This cannot be undone.')) {
        localStorage.removeItem('patients');
        patients = { 1: getEmptyPatientData() };
        currentPatientId = 1;
        patientData = patients[1];
        saveAllPatients();
        render();
        alert('All patient data cleared.');
      }
    }
    
    // Patient management functions
    window.switchPatient = function(patientId) {
      const id = parseInt(patientId);
      if (!patients[id]) {
        console.error('Patient', id, 'does not exist');
        return;
      }
      currentPatientId = id;
      patientData = patients[id];
      saveAllPatients(); // Save current patient selection
      render();
    };
    
    window.createNewPatient = function() {
      const patientCount = Object.keys(patients).length;
      if (patientCount >= MAX_PATIENTS) {
        alert(`Maximum of ${MAX_PATIENTS} patients reached. Please delete a patient before creating a new one.`);
        return;
      }
      
      // Find next available ID
      let newId = 1;
      while (patients[newId]) {
        newId++;
      }
      
      patients[newId] = getEmptyPatientData();
      currentPatientId = newId;
      patientData = patients[newId];
      saveAllPatients();
      render();
    };
    
    window.deletePatient = function(patientId) {
      const id = parseInt(patientId);
      const patientCount = Object.keys(patients).length;
      
      if (patientCount === 1) {
        alert('Cannot delete the last patient. Clear data instead.');
        return;
      }
      
      const patientLabel = getPatientLabel(id);
      if (!confirm(`Delete ${patientLabel}? This cannot be undone.`)) {
        return;
      }
      
      delete patients[id];
      
      // If we deleted the current patient, switch to another one
      if (id === currentPatientId) {
        currentPatientId = parseInt(Object.keys(patients)[0]);
        patientData = patients[currentPatientId];
      }
      
      saveAllPatients();
      render();
    };
    
    function getPatientLabel(id) {
      const patient = patients[id];
      if (!patient) return `Patient ${id}`;
      
      if (patient.demographics && patient.demographics.name) {
        return patient.demographics.name;
      }
      
      if (patient.presentation) {
        return `Patient ${id} (${patient.presentation})`;
      }
      
      return `Patient ${id}`;
    }

    async function loadUserPreferences() {
      if (!currentUser) return;
      
      try {
        const { data, error } = await supabaseClient
          .from('user_configs')
          .select('config_data')
          .eq('user_id', currentUser.id)
          .single();

        if (error && error.code !== 'PGRST116') {
          console.error('Error loading preferences:', error);
          return;
        }

        if (data && data.config_data) {
          // VALIDATE loaded data before using it
          try {
            // Check if config_data is a valid object
            if (typeof data.config_data !== 'object' || data.config_data === null) {
              console.warn('Invalid config_data format, using defaults');
              await saveUserPreferences(userPreferences);
              return;
            }
            
            // Validate customizations structure
            if (data.config_data.customizations && typeof data.config_data.customizations === 'object') {
              // Clean up any corrupted custom presentations
              if (Array.isArray(data.config_data.customizations.customPresentations)) {
                data.config_data.customizations.customPresentations = 
                  data.config_data.customizations.customPresentations.filter(cp => {
                    return cp && typeof cp === 'object' && cp.name && Array.isArray(cp.features);
                  });
              }
              
              // Clean up corrupted presentation customizations
              if (data.config_data.customizations.presentations && typeof data.config_data.customizations.presentations === 'object') {
                Object.keys(data.config_data.customizations.presentations).forEach(key => {
                  const pres = data.config_data.customizations.presentations[key];
                  if (!pres || typeof pres !== 'object') {
                    delete data.config_data.customizations.presentations[key];
                  }
                });
              }
            }
            
            // Safely assign validated data
            userPreferences = data.config_data;
            
          } catch (validationError) {
            console.error('Error validating config_data:', validationError);
            console.warn('Using default preferences due to validation error');
            await saveUserPreferences(userPreferences);
            return;
          }
        } else {
          await saveUserPreferences(userPreferences);
        }
        
        // Initialize any missing customizations with defaults
        initializeDefaultCustomizations();
        
      } catch (outerError) {
        console.error('Critical error in loadUserPreferences:', outerError);
        console.warn('Resetting to default preferences');
        // Reset to defaults if there's any critical error
        userPreferences = {
          customizations: {
            presentations: {},
            ros: {},
            exam: {},
            customROS: [],
            customExam: [],
            customPresentations: []
          }
        };
        initializeDefaultCustomizations();
      }
    }

    async function saveUserPreferences(prefs) {
      if (!currentUser) {
        console.warn('Cannot save: no user logged in');
        throw new Error('Not authenticated. Please sign in again.');
      }

      try {
        const { error } = await supabaseClient
          .from('user_configs')
          .upsert({
            user_id: currentUser.id,
            config_data: prefs
          }, {
            onConflict: 'user_id'
          });

        if (error) {
          console.error('Error saving preferences:', error);
          
          // Check if it's an auth error
          if (error.message && (
            error.message.includes('JWT') || 
            error.message.includes('token') || 
            error.message.includes('auth') ||
            error.code === 'PGRST301'
          )) {
            console.error('Authentication error detected - session may have expired');
            throw new Error('Session expired. Please sign out and sign in again to save changes.');
          }
          
          throw error;
        }

        userPreferences = prefs;
        console.log('Preferences saved to Supabase successfully');
        
      } catch (error) {
        console.error('Failed to save preferences:', error);
        throw error;
      }
    }

    function toggleROS(key) {
      // If there's a custom note, clear it first and reset to null
      if (patientData.notes && patientData.notes[key]) {
        delete patientData.notes[key];
        patientData.ros[key] = "null";
      } else {
        const current = patientData.ros[key] || "null";
        const next = current === "null" ? "safe" : current === "safe" ? "unsafe" : "null";
        patientData.ros[key] = next;
      }
      savePatientData();
      render();
    }

    function toggleExam(key) {
      // If there's a custom note, clear it first and reset to null
      if (patientData.notes && patientData.notes[key]) {
        delete patientData.notes[key];
        patientData.exam[key] = "null";
      } else {
        const current = patientData.exam[key] || "null";
        const next = current === "null" ? "safe" : current === "safe" ? "unsafe" : "null";
        patientData.exam[key] = next;
      }
      savePatientData();
      render();
    }

    function toggleFeature(key) {
      // Get the feature configuration to check button type
      const feature = getCustomizedFeatures(patientData.presentation).find(f => f.key === key);
      const buttonType = feature?.buttonType || 'tertiary';
      
      // If there's a custom note, clear it first and reset based on button type
      if (patientData.notes && patientData.notes[key]) {
        delete patientData.notes[key];
        patientData.features[key] = buttonType === 'binary' ? 'safe' : 'null';
      } else {
        const current = patientData.features[key] || 'null';
        let next;
        
        switch (buttonType) {
          case 'binary':
            // Binary: safe ↔ unsafe
            next = current === 'safe' ? 'unsafe' : 'safe';
            break;
            
          case 'severity':
            // Severity: null → mild → moderate → severe → null
            if (current === 'null') next = 'mild';
            else if (current === 'mild') next = 'moderate';
            else if (current === 'moderate') next = 'severe';
            else if (current === 'severe') next = 'null';
            else next = 'null';
            break;
            
          case 'duration':
            // Duration: null → short → medium → long → very-long → null
            if (current === 'null') next = 'short';
            else if (current === 'short') next = 'medium';
            else if (current === 'medium') next = 'long';
            else if (current === 'long') next = 'very-long';
            else if (current === 'very-long') next = 'null';
            else next = 'null';
            break;
            
          case 'pain-scale':
            // Pain scale: null → 0 → 1 → ... → 10 → null
            if (current === 'null') next = '0';
            else if (current === '10') next = 'null';
            else {
              const num = parseInt(current);
              next = isNaN(num) ? '0' : String(num + 1);
            }
            break;
            
          case 'tertiary':
          default:
            // Tertiary (default): null → safe → unsafe → null
            next = current === "null" ? "safe" : current === "safe" ? "unsafe" : "null";
            break;
        }
        
        patientData.features[key] = next;
      }
      
      // Auto-sync with ROS if mapping exists
      const rosKey = FEATURE_TO_ROS_MAP[key];
      if (rosKey) {
        patientData.ros[rosKey] = patientData.features[key];
      }
      
      savePatientData();
      render();
    }

    window.toggleDifferential = function(key) {
      // If there's a custom note, clear it first and reset to null
      if (patientData.notes && patientData.notes[key]) {
        delete patientData.notes[key];
        patientData.differentials[key] = "null";
      } else {
        const current = patientData.differentials[key] || "null";
        // Cycle: null → differential → diagnosis → null
        const next = current === "null" ? "differential" : 
                     current === "differential" ? "diagnosis" : "null";
        patientData.differentials[key] = next;
      }
      
      savePatientData();
      render();
    };

    function toggleInvestigationToggle(category, key) {
      // Get the toggle definition
      const toggle = INVESTIGATION_TOGGLES[category].find(t => t.key === key);
      if (!toggle) return;
      
      // Get current state (index in options array)
      const current = patientData.investigation_toggles[key] || 0;
      
      // Cycle to next option
      const next = (current + 1) % toggle.options.length;
      patientData.investigation_toggles[key] = next;
      
      savePatientData();
      render();
    }

    function getInvestigationToggleClass(index, maxOptions) {
      const base = "text-white text-xs px-2 py-1.5 rounded transition-all w-full text-left font-medium";
      if (index === 0) return `${base} bg-gray-500 hover:bg-gray-600`; // Not assessed/done
      if (index === 1) return `${base} bg-green-600 hover:bg-green-700`; // Normal/negative
      if (index === maxOptions - 1) return `${base} bg-red-600 hover:bg-red-700`; // Most abnormal
      return `${base} bg-yellow-600 hover:bg-yellow-700`; // Intermediate values
    }

    function getButtonClass(state, hasNote = false, buttonType = 'tertiary') {
      const base = "text-white text-sm px-3 py-2 rounded transition-all w-full text-left font-medium";
      
      // Purple for custom note (overrides everything)
      if (hasNote) return `${base} bg-purple-600 hover:bg-purple-700`;
      
      // Handle different button types
      switch (buttonType) {
        case 'binary':
          // Binary: Green (safe) or Red (unsafe)
          if (state === "safe") return `${base} bg-green-600 hover:bg-green-700`;
          if (state === "unsafe") return `${base} bg-red-600 hover:bg-red-700`;
          return `${base} bg-gray-500 hover:bg-gray-600`; // Shouldn't happen
          
        case 'severity':
          // Severity scale: Grey (null) → Green (mild) → Yellow (moderate) → Red (severe)
          if (state === "mild") return `${base} bg-green-500 hover:bg-green-600`;
          if (state === "moderate") return `${base} bg-yellow-500 hover:bg-yellow-600 text-gray-900`;
          if (state === "severe") return `${base} bg-red-600 hover:bg-red-700`;
          return `${base} bg-gray-500 hover:bg-gray-600`; // null
          
        case 'duration':
          // Duration: Grey (null) → Green (short) → Yellow (medium) → Orange (long) → Red (very long)
          if (state === "short") return `${base} bg-green-500 hover:bg-green-600`;
          if (state === "medium") return `${base} bg-yellow-500 hover:bg-yellow-600 text-gray-900`;
          if (state === "long") return `${base} bg-orange-500 hover:bg-orange-600`;
          if (state === "very-long") return `${base} bg-red-600 hover:bg-red-700`;
          return `${base} bg-gray-500 hover:bg-gray-600`; // null
          
        case 'pain-scale':
          // Pain scale 0-10: Grey (null), gradient from green (0-3) to yellow (4-6) to red (7-10)
          if (state === 'null') return `${base} bg-gray-500 hover:bg-gray-600`;
          const num = parseInt(state);
          if (isNaN(num)) return `${base} bg-gray-500 hover:bg-gray-600`;
          if (num === 0) return `${base} bg-green-600 hover:bg-green-700`;
          if (num <= 3) return `${base} bg-green-500 hover:bg-green-600`;
          if (num <= 6) return `${base} bg-yellow-500 hover:bg-yellow-600 text-gray-900`;
          if (num <= 9) return `${base} bg-orange-500 hover:bg-orange-600`;
          return `${base} bg-red-600 hover:bg-red-700`; // 10
          
        case 'tertiary':
        default:
          // Tertiary (default): Grey (null) → Green (safe) → Red (unsafe)
          if (state === "safe") return `${base} bg-green-600 hover:bg-green-700`;
          if (state === "unsafe") return `${base} bg-red-600 hover:bg-red-700`;
          return `${base} bg-gray-500 hover:bg-gray-600`; // null
      }
    }

    function getButtonText(safe, unsafe, state, noteText = null, buttonType = 'tertiary') {
      // If there's a custom note, show it
      if (noteText) return noteText;
      
      // Handle different button types
      switch (buttonType) {
        case 'binary':
          // Binary: Show safe or unsafe text
          return state === 'safe' ? safe : unsafe;
          
        case 'severity':
          // Severity: Show severity level
          if (state === 'mild') return 'Mild';
          if (state === 'moderate') return 'Moderate';
          if (state === 'severe') return 'Severe';
          return `${safe} / ${unsafe}`; // null
          
        case 'duration':
          // Duration: Show duration
          if (state === 'short') return '<5 min';
          if (state === 'medium') return '5-30 min';
          if (state === 'long') return '30min-6hr';
          if (state === 'very-long') return '>6 hours';
          return `${safe} / ${unsafe}`; // null
          
        case 'pain-scale':
          // Pain scale: Show number
          if (state === 'null') return `${safe} / ${unsafe}`;
          return `Pain: ${state}/10`;
          
        case 'tertiary':
        default:
          // Tertiary (default): Show safe/unsafe based on state
          if (state === "safe") return safe;
          if (state === "unsafe") return unsafe;
          return `${safe} / ${unsafe}`; // null
      }
    }

    function getDifferentialButtonClass(state, hasNote = false) {

      // Purple for custom note
      if (hasNote) return `${base} bg-purple-600 hover:bg-purple-700`;

      return `${base} bg-gray-500 hover:bg-gray-600`;
    }

    // ============================================================================
    // GRAMMAR HELPERS (LOCAL PROCESSING - NO AI)
    // ============================================================================

    function formatList(items, conjunction = "and") {
      if (items.length === 0) return "";
      if (items.length === 1) return items[0];
      if (items.length === 2) return `${items[0]} ${conjunction} ${items[1]}`;
      // Oxford comma for 3+
      return items.slice(0, -1).join(", ") + `, ${conjunction} ${items[items.length - 1]}`;
    }

    function lowercaseFirst(str) {
      if (!str) return str;
      
      // Get first word
      const firstWord = str.split(/\s+/)[0];
      
      // If first word is all uppercase (acronym like ECG, JVP, BP, etc.), keep it
      // Check if it's at least 2 characters and all letters are uppercase
      if (firstWord.length >= 2 && firstWord === firstWord.toUpperCase() && /^[A-Z]+$/.test(firstWord)) {
        return str; // Keep original capitalization
      }
      
      // Otherwise, lowercase first character as before
      return str.charAt(0).toLowerCase() + str.slice(1);
    }

    // Helper: given a feature and its current state, return the rendered text
    // for that feature (or null if no value to show), plus whether it's a positive
    // (unsafe/abnormal) or negative (safe/normal) finding.
    // Returns { text: string, polarity: 'positive'|'negative' } or null.
    function renderFeatureValue(feature, featuresData) {
      const state = featuresData[feature.key];
      const note = patientData.notes && patientData.notes[feature.key];
      const buttonType = feature.buttonType || 'tertiary';

      // Custom note overrides everything; treat it as a positive finding (it's
      // there because the doctor felt it warranted recording).
      if (note) {
        return { text: note, polarity: 'positive' };
      }

      switch (buttonType) {
        case 'binary':
          if (state === 'unsafe') return { text: lowercaseFirst(feature.unsafe), polarity: 'positive' };
          if (state === 'safe') return { text: lowercaseFirst(feature.safe), polarity: 'negative' };
          return null;
        case 'severity':
          if (state === 'mild' || state === 'moderate' || state === 'severe') {
            return { text: `${lowercaseFirst(feature.unsafe)} (${state})`, polarity: 'positive' };
          }
          return null;
        case 'duration':
          if (state && state !== 'null') {
            const durationText = {
              'short': '<5 min',
              'medium': '5-30 min',
              'long': '30min-6hr',
              'very-long': '>6 hours'
            }[state] || state;
            return { text: `${lowercaseFirst(feature.unsafe)} (duration: ${durationText})`, polarity: 'positive' };
          }
          return null;
        case 'pain-scale':
          if (state && state !== 'null') {
            return { text: `${lowercaseFirst(feature.unsafe)} (${state}/10)`, polarity: 'positive' };
          }
          return null;
        case 'tertiary':
        default:
          if (state === 'unsafe') return { text: lowercaseFirst(feature.unsafe), polarity: 'positive' };
          if (state === 'safe') return { text: lowercaseFirst(feature.safe), polarity: 'negative' };
          return null;
      }
    }

    // Section ordering for HOPC prose. Features tagged with these reportSection
    // values render in this order. Any feature without a reportSection (or with
    // a value not listed here) falls into the "_other" bucket at the end.
    const HOPC_SECTION_ORDER = [
      'pain_character',
      'triggers',
      'associated_symptoms',
      'risk_factors',
      '_other'
    ];

    // Build a single telegraphic sentence/phrase for a group of features.
    // Positives are listed plainly; negatives are prefixed with "No ".
    // Examples:
    //   positives only: "radiates to left arm with associated dyspnoea"
    //   negatives only: "no nausea, syncope, or palpitations"
    //   both: "radiates to left arm; no nausea or syncope"
    function buildSectionSentence(positives, negatives) {
      const parts = [];
      if (positives.length > 0) {
        parts.push(formatList(positives));
      }
      if (negatives.length > 0) {
        // Strip leading "no " from each negative since we'll add a single "No" at the front
        const stripped = negatives.map(n => n.replace(/^no\s+/i, ''));
        parts.push(`no ${formatList(stripped, 'or')}`);
      }
      if (parts.length === 0) return null;
      // Capitalise the first character of the resulting sentence.
      const joined = parts.join('; ');
      return joined.charAt(0).toUpperCase() + joined.slice(1) + '.';
    }

    function formatFeaturesProse(featuresData, presentation) {
      if (!presentation) {
        return null;
      }

      const mentionedItems = new Set(); // For deduplication against ROS

      // Group history features by reportSection
      const groups = {}; // { sectionKey: { positives: [], negatives: [] } }

      const allFeatures = getCustomizedFeatures(presentation);

      allFeatures.forEach(feature => {
        // Only History-type features go into HOPC prose
        if (feature.type !== 'History') return;

        const rendered = renderFeatureValue(feature, featuresData);
        if (!rendered) return;

        // Track for ROS dedup
        mentionedItems.add(rendered.text);

        // Bucket into the right section
        const sectionKey = (feature.reportSection && HOPC_SECTION_ORDER.includes(feature.reportSection))
          ? feature.reportSection
          : '_other';
        if (!groups[sectionKey]) groups[sectionKey] = { positives: [], negatives: [] };
        if (rendered.polarity === 'positive') {
          groups[sectionKey].positives.push(rendered.text);
        } else {
          groups[sectionKey].negatives.push(rendered.text);
        }
      });

      // Emit groups in the canonical order, skipping empty ones
      const sentences = [];
      HOPC_SECTION_ORDER.forEach(sectionKey => {
        const group = groups[sectionKey];
        if (!group) return;
        const sentence = buildSectionSentence(group.positives, group.negatives);
        if (sentence) sentences.push(sentence);
      });

      return {
        text: sentences.length > 0 ? sentences.join(' ') : null,
        mentioned: mentionedItems
      };
    }

    function formatROSProse(rosData, excludeItems = new Set()) {
      const positives = [];
      const negatives = [];
      
      ROS_SYSTEMS.forEach(([system, items]) => {
        items.forEach(([safe, unsafe]) => {
          const key = `ros_${safe}`;
          const state = rosData[key];
          const note = patientData.notes && patientData.notes[key];
          
          // Get custom text if available
          const custom = userPreferences.customizations.ros[key] || {};
          const displaySafe = custom.safe || safe;
          const displayUnsafe = custom.unsafe || unsafe;
          
          // Skip if already mentioned in features
          const unsafeLower = lowercaseFirst(displayUnsafe);
          const safeLower = lowercaseFirst(displaySafe);
          
          // If there's a custom note, always include it (regardless of state)
          if (note) {
            positives.push(note);
          } else if (state === "unsafe" && !excludeItems.has(unsafeLower)) {
            positives.push(unsafeLower);
          } else if (state === "safe" && !excludeItems.has(safeLower)) {
            negatives.push(safeLower);
          }
        });
      });
      
      // Add custom ROS items
      (userPreferences.customizations.customROS || []).filter(item => item).forEach(item => {
        const state = rosData[item.key];
        const note = patientData.notes && patientData.notes[item.key];
        
        // If there's a custom note, always include it (regardless of state)
        if (note) {
          positives.push(note);
        } else if (state === "unsafe") {
          positives.push(lowercaseFirst(item.unsafe));
        } else if (state === "safe") {
          negatives.push(lowercaseFirst(item.safe));
        }
      });

      const sentences = [];
      
      if (positives.length > 0) {
        sentences.push(`The patient reported ${formatList(positives)}.`);
      }
      
      if (negatives.length > 0) {
        // Capitalize first item and list directly without "There were/was"
        const capitalized = negatives.map((item, index) => 
          index === 0 ? item.charAt(0).toUpperCase() + item.slice(1) : item
        );
        sentences.push(`${formatList(capitalized)}.`);
      }
      
      // Return null if nothing was toggled (so ROS section can be omitted)
      if (sentences.length === 0) {
        return null;
      }
      
      return sentences.join(" ");
    }

    function formatExamProse(examData, presentation = null) {
      const findings = {};

      // Helper to push into a section's findings, creating it if needed
      const addFinding = (section, polarity, text) => {
        if (!findings[section]) findings[section] = { positive: [], negative: [] };
        if (polarity === 'positive') findings[section].positive.push(text);
        else findings[section].negative.push(text);
      };

      // 1. Standard examination sections (General / Cardiovascular / etc.)
      Object.entries(EXAM_SECTIONS).forEach(([section, buttons]) => {
        buttons.forEach(btn => {
          const state = examData[btn.key];
          const note = patientData.notes && patientData.notes[btn.key];

          const custom = userPreferences.customizations.exam[btn.key] || {};
          const displaySafe = custom.safe || btn.safe;
          const displayUnsafe = custom.unsafe || btn.unsafe;

          if (note) {
            addFinding(section, 'positive', note);
          } else if (state === 'safe') {
            addFinding(section, 'negative', lowercaseFirst(displaySafe));
          } else if (state === 'unsafe') {
            addFinding(section, 'positive', lowercaseFirst(displayUnsafe));
          }
        });

        // Custom exam items the user added under this section
        (userPreferences.customizations.customExam || [])
          .filter(item => item && item.section === section)
          .forEach(item => {
            const state = examData[item.key];
            const note = patientData.notes && patientData.notes[item.key];
            if (note) {
              addFinding(section, 'positive', note);
            } else if (state === 'safe') {
              addFinding(section, 'negative', lowercaseFirst(item.safe));
            } else if (state === 'unsafe') {
              addFinding(section, 'positive', lowercaseFirst(item.unsafe));
            }
          });
      });

      // 2. Presentation-specific exam features fold into their declared examSystem.
      //    Features without examSystem fall back to a "Presentation-specific" bucket
      //    so nothing gets lost (existing data without the new field still works).
      if (presentation) {
        const allFeatures = getCustomizedFeatures(presentation);
        const examFeatures = allFeatures.filter(f => f.type === 'Exam' || f.type === 'Examination');

        examFeatures.forEach(feature => {
          const state = patientData.features[feature.key];
          const note = patientData.notes && patientData.notes[feature.key];

          let text = null;
          let polarity = null;

          if (note) {
            text = note;
            polarity = 'positive';
          } else if (state === 'safe') {
            text = lowercaseFirst(feature.safe);
            polarity = 'negative';
          } else if (state === 'unsafe') {
            text = lowercaseFirst(feature.unsafe);
            polarity = 'positive';
          }

          if (text === null) return;

          // examSystem must match a real EXAM_SECTIONS key to be folded in
          const targetSection = (feature.examSystem && EXAM_SECTIONS[feature.examSystem])
            ? feature.examSystem
            : 'Presentation-specific';
          addFinding(targetSection, polarity, text);
        });
      }

      // 3. Render. Standard sections in EXAM_SECTIONS order, then anything else
      //    (which in practice means "Presentation-specific" only).
      const sectionOrder = [
        ...Object.keys(EXAM_SECTIONS),
        ...Object.keys(findings).filter(s => !(s in EXAM_SECTIONS))
      ];

      const sentences = [];
      sectionOrder.forEach(section => {
        const f = findings[section];
        if (!f) return;
        const { positive, negative } = f;

        let body = '';
        if (positive.length > 0 && negative.length > 0) {
          body = `${formatList(positive)}, but ${formatList(negative)}`;
        } else if (positive.length > 0) {
          body = formatList(positive);
        } else if (negative.length > 0) {
          body = formatList(negative);
        } else {
          return;
        }

        // "Presentation-specific" gets no label prefix (legacy behaviour)
        if (section === 'Presentation-specific') {
          sentences.push(`${body}.`);
        } else {
          sentences.push(`${section}: ${body}.`);
        }
      });

      return sentences.length > 0 ? sentences.join(' ') : null;
    }

    async function initialize() {
      // Check and clear old patient data (if new day)
      checkAndClearOldData();
      
      // Load collapsed sections state
      const savedCollapsed = localStorage.getItem('collapsedSections');
      if (savedCollapsed) {
        try {
          collapsedSections = JSON.parse(savedCollapsed);
        } catch (e) {
          console.error('Error loading collapsed sections:', e);
        }
      }
      
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        await loadUserPreferences();
      }

      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session) {
          currentUser = session.user;
          await loadUserPreferences();
        } else {
          currentUser = null;
          userPreferences = {};
        }
        render();
      });

      render();
    }

    // iOS-safe clipboard copy with fallback for older Safari / when permissions block
    // Returns true if copy succeeded, false otherwise
    function copyToClipboard(text) {
      // Try the modern API first
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          console.warn('navigator.clipboard.writeText failed, falling back:', err);
        }
      }
      // Fallback: hidden textarea + execCommand. Works on iOS Safari reliably.
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        ta.style.pointerEvents = 'none';
        document.body.appendChild(ta);
        // iOS-specific selection method
        if (navigator.userAgent.match(/ipad|iphone/i)) {
          const range = document.createRange();
          range.selectNodeContents(ta);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ta.setSelectionRange(0, text.length);
        } else {
          ta.select();
        }
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (err) {
        console.error('Clipboard fallback failed:', err);
        return false;
      }
    }

    function buildCompletenessQuery(presentation) {
      // Get all features for this presentation
      let allFeatures = [];
      
      // Check if it's a built-in presentation
      if (MASTER_FEATURES[presentation]) {
        const customization = userPreferences.customizations.presentations[presentation];
        if (customization) {
          allFeatures = [
            ...(customization.features || MASTER_FEATURES[presentation] || []),
            ...(customization.customFeatures || [])
          ];
        } else {
          allFeatures = MASTER_FEATURES[presentation] || [];
        }
      } else {
        // It's a custom presentation
        const customPres = userPreferences.customizations.customPresentations?.find(cp => cp.name === presentation);
        if (customPres) {
          allFeatures = customPres.features || [];
        }
      }
      
      // Build the query
      let query = `Clinical Assessment Checklist Completeness Review\n\n`;
      query += `Presentation: ${presentation}\n\n`;
      query += `I have designed a clinical assessment checklist for "${presentation}" presentations. `;
      query += `Please review the following checklist items and provide feedback on:\n`;
      query += `1. What critical features or red flags might be missing?\n`;
      query += `2. What additional history, examination, or investigation items would improve completeness?\n`;
      query += `3. Are there any items that seem unnecessary or redundant?\n\n`;
      query += `Current Checklist Items:\n\n`;
      
      // Group by type
      const historyItems = allFeatures.filter(f => f.type === 'History' || !f.type);
      const examItems = allFeatures.filter(f => f.type === 'Examination' || f.type === 'Exam');
      const invItems = allFeatures.filter(f => f.type === 'Investigation');
      const ddxItems = allFeatures.filter(f => f.type === 'Differential Diagnosis');
      
      if (historyItems.length > 0) {
        query += `HISTORY ITEMS:\n`;
        historyItems.forEach((f, i) => {
          query += `${i + 1}. ${f.safe} / ${f.unsafe}${f.redFlag ? ' [RED FLAG]' : ''}\n`;
        });
        query += `\n`;
      }
      
      if (examItems.length > 0) {
        query += `EXAMINATION ITEMS:\n`;
        examItems.forEach((f, i) => {
          query += `${i + 1}. ${f.safe} / ${f.unsafe}${f.redFlag ? ' [RED FLAG]' : ''}\n`;
        });
        query += `\n`;
      }
      
      if (invItems.length > 0) {
        query += `INVESTIGATION ITEMS:\n`;
        invItems.forEach((f, i) => {
          query += `${i + 1}. ${f.safe} / ${f.unsafe}${f.redFlag ? ' [RED FLAG]' : ''}\n`;
        });
        query += `\n`;
      }
      
      if (ddxItems.length > 0) {
        query += `DIFFERENTIAL DIAGNOSIS CONSIDERATIONS:\n`;
        ddxItems.forEach((f, i) => {
          query += `${i + 1}. ${f.safe} / ${f.unsafe}\n`;
        });
        query += `\n`;
      }
      
      if (allFeatures.length === 0) {
        query += `(No checklist items defined yet)\n\n`;
      }
      
      query += `Please provide specific, evidence-based suggestions for improving this checklist's comprehensiveness and clinical utility.`;
      
      return query;
    }

    // Editorial system prompt — the core "brains" of the feature.
    // This is what makes the JSON produce clean prose reports.
    function buildAIBuilderSystemPrompt() {
      return `You are an expert clinical informatics editor designing a structured assessment checklist for a GP/ED clinical tool. Your output will populate buttons that doctors tap during patient encounters; the same data is rendered into a written clinical note. Your single most important goal: **the rendered note must read like polished doctor's prose, first time, with zero editing required.**

## Architecture you are designing for

Each "feature" becomes a button. When toggled "unsafe" (positive finding), the \`unsafe\` text drops into a sentence. When toggled "safe" (pertinent negative), the \`safe\` text drops in. Multiple features get joined with commas/"and" automatically.

The report engine concatenates features into sentences like:
> "Associated features: <unsafe>, <unsafe>, and <unsafe>. <Safe>, <safe>, and <safe>."
> "On examination, <unsafe>. <Safe>."

So your label text MUST be:
- **A grammatical fragment that drops into prose** — never a question, never a header, never imperative
- **Lowercase first letter** (the engine capitalises when needed)
- **No leading "no"/"absent"/"denies"/"normal"** repetition — the engine handles negation framing
- Examples of GOOD \`unsafe\` text: "radiates to left arm", "associated dyspnoea", "syncope at onset"
- Examples of BAD \`unsafe\` text: "Does the pain radiate?", "Pain radiating to left arm", "Yes — radiation present"
- Examples of GOOD \`safe\` text: "no radiation", "no associated dyspnoea", "no syncope"
- Examples of BAD \`safe\` text: "Pain does not radiate", "Patient denies dyspnoea"

## Schema for each feature

\`\`\`
{
  "key": "snake_case_unique_id",
  "safe": "fragment for pertinent negative",
  "unsafe": "fragment for positive finding",
  "type": "History" | "Examination" | "Investigation" | "Differential Diagnosis",
  "buttonType": "tertiary" | "binary" | "severity" | "duration" | "pain-scale",
  "redFlag": true | false,
  "comment": "optional brief evidence note (≤120 chars) shown on hover",
  "reportSection": "pain_character" | "associated_symptoms" | "risk_factors" | "triggers",
  "examSystem": "General" | "Cardiovascular" | "Respiratory" | "Abdominal" | "Neurological" | "Musculoskeletal"
}
\`\`\`

\`reportSection\` applies only to History-type features. \`examSystem\` applies only to Examination-type features. Omit each field on features where it doesn't apply.

## Editorial rules

1. **Order matters.** Within each \`type\`, order features in the natural order a doctor describes them in a note (onset → character → radiation → associated symptoms → modifying factors → risk factors). The engine emits features in array order.

2. **Group History features by reportSection — this is critical for readable output.** Features with the same \`reportSection\` render as a single telegraphic sentence in the HOPC. Use the four allowed values:
   - \`pain_character\` — quality, location, radiation, severity, onset pattern
   - \`triggers\` — what brings it on or worsens it (exertion, food, position, time of day)
   - \`associated_symptoms\` — concurrent features (dyspnoea, nausea, diaphoresis, etc.)
   - \`risk_factors\` — predisposing history (smoking, family history, comorbidities)

   The output looks like: "Pain radiates to left arm. Triggered by exertion. Associated dyspnoea and diaphoresis. No nausea, syncope, or palpitations. Smoker, hypertensive."
   Each section is one short sentence. Plan your features so they cluster cleanly into these four groups.

3. **Tag Examination features with examSystem so they render under the right body system.** Use the system that matches where a doctor would document the finding, not where the symptom presents:
   - \`General\` — appearance, vital signs, hydration, alertness
   - \`Cardiovascular\` — pulses, JVP, heart sounds, peripheral oedema, perfusion
   - \`Respiratory\` — chest signs, work of breathing, oxygenation
   - \`Abdominal\` — tenderness, masses, peritonism, organomegaly, bowel sounds
   - \`Neurological\` — GCS, cranial nerves, power, sensation, reflexes, gait
   - \`Musculoskeletal\` — ROM, swelling, deformity, tenderness in bones/joints

   Untagged exam features fall into a generic "Presentation-specific" bucket — avoid this; tag every exam feature.

4. **Button types — choose deliberately:**
   - \`tertiary\` (default): null → safe → unsafe → null. Use for most things.
   - \`binary\`: safe ↔ unsafe (no null). Use for things that MUST be assessed (e.g. "stable / hemodynamically unstable").
   - \`severity\`: null → mild → moderate → severe. Use for symptom severity where it changes management.
   - \`duration\`: <5min / 5–30min / 30min–6hr / >6hr. Use ONLY for symptoms where duration is diagnostically critical.
   - \`pain-scale\`: 0–10. Use ONLY for actual pain assessment.
   - **Default to tertiary unless there is a clear reason.** Don't proliferate button types.

5. **Red flags**: Mark as \`redFlag: true\` only the genuinely killer items — things that mandate immediate escalation. Be parsimonious. Per Gawande's checklist manifesto, red flags should be the "killer items," not every concerning finding.

6. **Length.** Aim for **20–30 features total**. Resist the urge to include everything OE suggests. Cut anything that:
   - Is captured by a more general item already
   - Is rarely diagnostically useful
   - Is more appropriately a free-text field than a button

7. **Phrasing test — apply to every label.** The HOPC renders telegraphically — short clipped sentences, doctor-style. Read your sentence aloud:
   - Within a reportSection group, positives become "<unsafe1>, <unsafe2>, and <unsafe3>"; negatives become "no <unsafe1>, <unsafe2>, or <unsafe3>"
   - Worked example for pain_character group: "Pain radiates to left arm, sharp in quality, with sudden onset."
   - Worked example for negatives in associated_symptoms: "No nausea, syncope, or palpitations."
   If your label doesn't read cleanly when slotted in like that, rephrase it.

8. **Comments**: Add \`comment\` only where it adds genuine clinical pearl value (likelihood ratio, classic teaching, key distinction). Skip on obvious items.

Return a SINGLE valid JSON object with this exact shape, and NOTHING else (no markdown, no commentary outside the JSON):

\`\`\`
{

  "features": [ /* 20–30 features, ordered for natural prose flow */ ]
}
\`\`\`

Do not include any other top-level keys. Do not wrap in markdown code blocks. Begin your response with \`{\` and end with \`}\`.`;

    function buildAIBuilderUserMessage(presentation, oeReviewText, currentFeatures) {
      let msg = `Presentation: ${presentation}\n\n`;
      msg += `## OpenEvidence review to incorporate:\n\n`;
      msg += oeReviewText.trim();
      msg += `\n\n## My current checklist (for reference — feel free to redesign entirely):\n\n`;
      
      if (currentFeatures.length === 0) {
        msg += `(Empty — design from scratch using the OE review.)\n`;
      } else {
        currentFeatures.forEach((f, i) => {
          const flag = f.redFlag ? ' [RED FLAG]' : '';
          msg += `${i + 1}. [${f.type || 'History'}] ${f.safe} / ${f.unsafe}${flag}\n`;
        });
      }
      
      msg += `\n## Your task:\n\n`;
      msg += `Design a clean, prose-friendly checklist incorporating the OE review's evidence-based recommendations. `;
      msg += `Apply ALL the editorial rules in the system prompt. The output must produce a polished, readable note when features are toggled.\n\n`;
      msg += `Return only the JSON object — no other text.`;
      
      return msg;
    }

    function getCurrentFeaturesForPresentation(presentation) {
      let allFeatures = [];
      if (MASTER_FEATURES[presentation]) {
        const customization = userPreferences.customizations.presentations[presentation];
        if (customization) {
          allFeatures = [
            ...(customization.features || MASTER_FEATURES[presentation] || []),
            ...(customization.customFeatures || [])
          ];
        } else {
          allFeatures = MASTER_FEATURES[presentation] || [];
        }
      } else {
        const customPres = userPreferences.customizations.customPresentations?.find(cp => cp.name === presentation);
        if (customPres) allFeatures = customPres.features || [];
      }
      return allFeatures.filter(f => f != null);
    }

    window.processWithAI = async function() {
      const oeText = aiBuilderState.oeReviewText.trim();
      if (oeText.length < 50) {
        aiBuilderState.errorMessage = 'Please paste the full OpenEvidence response (at least a few sentences).';
        render();
        return;
      }
      
      if (!WORKER_URL) {
        // No worker configured → fall through to manual mode
        switchToManualPaste();
        return;
      }

      aiBuilderState.errorMessage = '';
      aiBuilderState.step = 'processing';
      render();

      try {
        const currentFeatures = getCurrentFeaturesForPresentation(aiBuilderState.presentation);
        const systemPrompt = buildAIBuilderSystemPrompt();
        const userMessage = buildAIBuilderUserMessage(aiBuilderState.presentation, oeText, currentFeatures);

        const response = await fetch(`${WORKER_URL}/api/claude`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-5-20250929',
            max_tokens: 4000,
            system: systemPrompt,
            messages: [{ role: 'user', content: userMessage }]
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Worker returned ${response.status}: ${errText.slice(0, 200)}`);
        }

        const data = await response.json();
        
        // Extract text from response
        let aiText = '';
        if (data.content && Array.isArray(data.content)) {
          aiText = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
        } else if (typeof data.completion === 'string') {
          aiText = data.completion;
        } else {
          throw new Error('Unexpected response format from Claude');
        }

        // Parse the JSON (allow for code fences just in case)
        const jsonText = extractJsonFromText(aiText);
        const parsed = JSON.parse(jsonText);
        
        if (!parsed.features || !Array.isArray(parsed.features)) {
          throw new Error('AI response missing "features" array');
        }
        
        aiBuilderState.generatedJson = parsed;
        aiBuilderState.generatedJsonText = JSON.stringify(parsed, null, 2);
        aiBuilderState.step = 'review';
        aiBuilderState.errorMessage = '';
        render();
        
      } catch (err) {
        console.error('AI processing error:', err);
        aiBuilderState.step = 'paste';
        aiBuilderState.errorMessage = `AI processing failed: ${err.message}. You can try "Manual mode" instead.`;
        render();
      }
    };

    function extractJsonFromText(text) {
      // Strip markdown code fences if present
      let cleaned = text.trim();
      cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/i, '');
      // Find first { and last } to bracket the JSON
      const firstBrace = cleaned.indexOf('{');
      const lastBrace = cleaned.lastIndexOf('}');
      if (firstBrace === -1 || lastBrace === -1 || lastBrace < firstBrace) {
        throw new Error('No JSON object found in response');
      }
      return cleaned.slice(firstBrace, lastBrace + 1);
    }

    window.importGeneratedJson = function(replaceAll) {
      // Re-parse from textarea in case the user edited
      let parsed;
      try {
        parsed = JSON.parse(aiBuilderState.generatedJsonText);
      } catch (err) {
        aiBuilderState.errorMessage = `JSON is no longer valid: ${err.message}`;
        render();
        return;
      }
      
      if (!parsed.features || !Array.isArray(parsed.features)) {
        aiBuilderState.errorMessage = 'JSON must have a "features" array.';
        render();
        return;
      }

      const presentation = aiBuilderState.presentation;
      const isBuiltIn = !!MASTER_FEATURES[presentation];
      
      // Normalise features — strip _design_notes and any unknown top-level fields
      const cleanFeatures = parsed.features.map(f => {
        const out = {
          key: f.key || `ai_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          safe: f.safe || '',
          unsafe: f.unsafe || '',
          type: f.type || 'History',
          visible: f.visible !== false,
          redFlag: !!f.redFlag,
          buttonType: f.buttonType || 'tertiary'
        };
        if (f.comment) out.comment = f.comment;
        if (f.reportSection) out.reportSection = f.reportSection;
        if (f.examSystem) out.examSystem = f.examSystem;
        return out;
      });

      if (isBuiltIn) {
        if (replaceAll || !userPreferences.customizations.presentations[presentation]) {
          userPreferences.customizations.presentations[presentation] = {
            features: cleanFeatures,
            customFeatures: []
          };
        } else {
          // Merge by key — incoming features win on conflicts, new ones appended
          const existing = userPreferences.customizations.presentations[presentation];
          const existingKeys = new Set((existing.features || []).map(f => f.key));
          const updated = (existing.features || []).map(f => {
            const incoming = cleanFeatures.find(c => c.key === f.key);
            return incoming || f;
          });
          cleanFeatures.forEach(c => {
            if (!existingKeys.has(c.key)) updated.push(c);
          });
          existing.features = updated;
        }
      } else {
        // Custom presentation
        if (!userPreferences.customizations.customPresentations) {
          userPreferences.customizations.customPresentations = [];
        }
        const idx = userPreferences.customizations.customPresentations.findIndex(cp => cp.name === presentation);
        if (idx >= 0) {
          if (replaceAll) {
            userPreferences.customizations.customPresentations[idx].features = cleanFeatures;
          } else {
            const existing = userPreferences.customizations.customPresentations[idx].features || [];
            const existingKeys = new Set(existing.map(f => f.key));
            const updated = existing.map(f => {
              const incoming = cleanFeatures.find(c => c.key === f.key);
              return incoming || f;
            });
            cleanFeatures.forEach(c => {
              if (!existingKeys.has(c.key)) updated.push(c);
            });
            userPreferences.customizations.customPresentations[idx].features = updated;
          }
        } else {
          userPreferences.customizations.customPresentations.push({
            name: presentation,
            features: cleanFeatures
          });
        }
      }
      
      saveCustomizationsSilent();
      closeAIBuilderModal();
      alert(`✓ Imported ${cleanFeatures.length} features for "${presentation}".\n\nOpen the presentation tab to review them.`);
    };

    window.handleImportFile = async function(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      // Check if session is valid before importing
      const sessionValid = await checkSessionValid();
      if (!sessionValid) {
        alert('⚠️ WARNING: Your session has expired or is invalid.\n\nYou can still import, but changes will NOT be saved to the cloud.\n\nTo fix:\n1. Sign out completely\n2. Sign in again\n3. Re-import this file\n\nContinue with import anyway?');
        // Still allow import to localStorage, but warn them
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importData = JSON.parse(e.target.result);
          
          // Validate format
          if (!importData.presentation || !importData.features || !Array.isArray(importData.features)) {
            alert('Invalid import file format. Expected JSON with "presentation" and "features" array.');
            return;
          }
          
          const presentation = importData.presentation;
          
          // Check if presentation exists
          if (!MASTER_FEATURES[presentation]) {
            alert(`Presentation "${presentation}" not found in the system. Please check the presentation name matches exactly.`);
            return;
          }
          
          // Initialize customization if needed
          if (!userPreferences.customizations.presentations[presentation]) {
            userPreferences.customizations.presentations[presentation] = {
              features: MASTER_FEATURES[presentation].map(f => ({ 
                ...f, 
                visible: true, 
                redFlag: f.redFlag || false
              })),
              customFeatures: []
            };
          }
          
          let addedCount = 0;
          let errorCount = 0;
          
          // Add each feature
          importData.features.forEach(feature => {
            try {
              // Validate feature
              if (!feature.safe || !feature.unsafe || !feature.type) {
                console.warn('Skipping feature with missing fields:', feature);
                errorCount++;
                return;
              }
              
              // Validate type
              if (!['History', 'Examination', 'Investigation', 'Differential Diagnosis'].includes(feature.type)) {
                console.warn('Skipping feature with invalid type:', feature.type);
                errorCount++;
                return;
              }
              
              const customKey = `custom_${presentation}_${Date.now()}_${addedCount}`;
              userPreferences.customizations.presentations[presentation].customFeatures.push({
                key: customKey,
                safe: feature.safe,
                unsafe: feature.unsafe,
                type: feature.type,
                visible: feature.visible !== false, // Default to true if not specified
                redFlag: feature.redFlag === true // Default to false if not specified
              });
              
              addedCount++;
            } catch (err) {
              console.error('Error adding feature:', err);
              errorCount++;
            }
          });
          
          // Save to database
          saveCustomizationsSilent();
          render();
          
          // Show summary

    window.handleDragStart = function(event) {
      draggedElement = event.target;
      draggedIndex = parseInt(event.target.dataset.index);
      draggedPresentation = event.target.dataset.presentation;
      
      event.target.style.opacity = '0.4';
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/html', event.target.innerHTML);

    window.handleCustomDragStart = function(event) {
      draggedElement = event.target;

    window.handleDragOver = function(event) {
      if (event.preventDefault) {
        event.preventDefault();
      }
      
      event.dataTransfer.dropEffect = 'move';
      
      // Visual feedback
      const target = event.target.closest('.draggable-feature');
      if (target && target !== draggedElement) {
        target.style.borderTop = '2px solid #4F46E5';
      }
      
      return false;
    };

    window.handleDrop = function(event) {
      if (event.stopPropagation) {
        event.stopPropagation();
      }
      
      const target = event.target.closest('.draggable-feature');
      if (!target || target === draggedElement) {
        return false;
      }
      
      const dropPresentation = target.dataset.presentation;
      const dropIndex = parseInt(target.dataset.index);
      
      // Only allow drops within same presentation
      if (dropPresentation !== draggedPresentation) {
        return false;
      }
      
      // Reorder features
      const custom = userPreferences.customizations.presentations[draggedPresentation];
      if (!custom) return false;
      
      const features = custom.features;
      const [removed] = features.splice(draggedIndex, 1);
      features.splice(dropIndex, 0, removed);
      
      saveCustomizationsSilent();
      render();
      
      return false;
    };

    window.handleCustomDrop = function(event) {
      if (event.stopPropagation) {
        event.stopPropagation();
      }
      
      const target = event.target.closest('.draggable-feature');
      if (!target || target === draggedElement) {

      const dropCustomIdx = parseInt(target.dataset.customPresentationIdx);
      const dropIndex = parseInt(target.dataset.index);
      
      // Only allow drops within same custom presentation

      return false;

    window.handleImportFeatures = async function(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      // Check if session is valid before importing
      const sessionValid = await checkSessionValid();
      if (!sessionValid) {
        alert('⚠️ WARNING: Your session has expired or is invalid.\n\nYou can still import, but changes will NOT be saved to the cloud.\n\nTo fix:\n1. Sign out completely\n2. Sign in again\n3. Re-import this file\n\nContinue with import anyway?');
        // Still allow import to localStorage, but warn them
      }
      
      try {
        const text = await file.text();
        const importData = JSON.parse(text);
        
        // Validate structure
        if (!importData.version) {
          throw new Error('Invalid file format: missing version');
        }
        
        let importCount = 0;
        let updateCount = 0;
        
        // Import presentation customizations
        if (importData.presentations) {
          Object.keys(importData.presentations).forEach(presName => {
            const importedPres = importData.presentations[presName];
            
            if (!userPreferences.customizations.presentations[presName]) {
              // New presentation customization
              userPreferences.customizations.presentations[presName] = importedPres;
              importCount++;
            } else {
              // Merge features - add new ones that don't exist
              const existing = userPreferences.customizations.presentations[presName];
              const existingKeys = new Set(existing.features.map(f => f.key));
              
              importedPres.features.forEach(importedFeature => {
                if (!existingKeys.has(importedFeature.key)) {
                  existing.features.push(importedFeature);
                  importCount++;
                } else {
                  // Update existing feature
                  const idx = existing.features.findIndex(f => f.key === importedFeature.key);
                  if (idx >= 0) {
                    existing.features[idx] = importedFeature;
                    updateCount++;
                  }
                }
              });
            }
          });
        }
        
        // Import custom presentations
        if (importData.customPresentations && Array.isArray(importData.customPresentations)) {
          if (!userPreferences.customizations.customPresentations) {
            userPreferences.customizations.customPresentations = [];
          }
          
          importData.customPresentations.forEach(importedCustomPres => {
            const existingIdx = userPreferences.customizations.customPresentations
              .findIndex(cp => cp.name === importedCustomPres.name);
            
            if (existingIdx === -1) {
              // New custom presentation
              userPreferences.customizations.customPresentations.push(importedCustomPres);
              importCount += importedCustomPres.features.length;
            } else {
              // Merge features
              const existing = userPreferences.customizations.customPresentations[existingIdx];
              const existingKeys = new Set(existing.features.map(f => f.key));
              
              importedCustomPres.features.forEach(importedFeature => {
                if (!existingKeys.has(importedFeature.key)) {
                  existing.features.push(importedFeature);
                  importCount++;
                }
              });
            }
          });
        }
        
        saveCustomizationsSilent();
        render();
        
        alert(`Import successful!\n\nNew features: ${importCount}\nUpdated features: ${updateCount}`);
        
      } catch (error) {
        console.error('Import error:', error);
        alert(`Import failed: ${error.message}\n\nPlease ensure the file is a valid JSON export from this tool.`);
      }
      
      // Reset file input
      event.target.value = '';
    };
