      features[fIdx] = features[fIdx - 1];
      features[fIdx - 1] = temp;
      
      saveCustomizationsSilent();
      render();
    };

    window.moveCustomPresentationFeatureDown = function(cpIdx, fIdx) {
      const features = userPreferences.customizations.customPresentations[cpIdx].features;
      if (fIdx >= features.length - 1) return;
      
      const temp = features[fIdx];
      features[fIdx] = features[fIdx + 1];
      features[fIdx + 1] = temp;
      
      saveCustomizationsSilent();
      render();
    };

    window.changeCustomPresentationFeatureType = function(cpIdx, fIdx, newType) {
      try {
        console.log('Changing type for custom presentation:', cpIdx, 'feature:', fIdx, 'to:', newType);
        
        if (!userPreferences.customizations.customPresentations[cpIdx]) {
          console.error('Custom presentation not found at index:', cpIdx);
          alert('Error: Presentation not found');
          return;
        }
        
        if (!userPreferences.customizations.customPresentations[cpIdx].features[fIdx]) {
          console.error('Feature not found at index:', fIdx);
          alert('Error: Feature not found');
          return;
        }
        
        userPreferences.customizations.customPresentations[cpIdx].features[fIdx].type = newType;
        console.log('Type changed successfully');
        
        saveCustomizationsSilent();
        render();
      } catch (error) {
        console.error('Error changing feature type:', error);
        alert('Error changing type: ' + error.message);
      }
    };

    window.toggleROSVisibility = function(key) {
      if (!userPreferences.customizations.ros[key]) {
        userPreferences.customizations.ros[key] = { visible: true, customSafe: null, customUnsafe: null, redFlag: false };
      }
      userPreferences.customizations.ros[key].visible = !userPreferences.customizations.ros[key].visible;
      render();
    };

    window.toggleROSRedFlag = function(key) {
      if (!userPreferences.customizations.ros[key]) {
        userPreferences.customizations.ros[key] = { visible: true, customSafe: null, customUnsafe: null, redFlag: false };
      }
      userPreferences.customizations.ros[key].redFlag = !userPreferences.customizations.ros[key].redFlag;
      render();
    };

    window.toggleExamVisibility = function(key) {
      if (!userPreferences.customizations.exam[key]) {
        userPreferences.customizations.exam[key] = { visible: true, customSafe: null, customUnsafe: null, redFlag: false };
      }
      userPreferences.customizations.exam[key].visible = !userPreferences.customizations.exam[key].visible;
      render();
    };

    window.toggleExamRedFlag = function(key) {
      if (!userPreferences.customizations.exam[key]) {
        userPreferences.customizations.exam[key] = { visible: true, customSafe: null, customUnsafe: null, redFlag: false };
      }
      userPreferences.customizations.exam[key].redFlag = !userPreferences.customizations.exam[key].redFlag;
      render();
    };

    window.updateManagementTemplate = function(diagnosis, template) {
      if (!userPreferences.customizations.managementPlanTemplates) {
        userPreferences.customizations.managementPlanTemplates = {};
      }
      userPreferences.customizations.managementPlanTemplates[diagnosis] = template;
      // Don't render yet - wait for Save button
    };

    window.resetManagementTemplate = function(diagnosis) {
      if (userPreferences.customizations.managementPlanTemplates) {
        delete userPreferences.customizations.managementPlanTemplates[diagnosis];
        render();
      }
    };

    window.showAddCustomTemplate = function() {
      showCustomTemplateForm = true;
      editingCustomTemplate = { name: '', template: '' };
      render();
    };

    window.saveCustomTemplate = function() {
      const name = editingCustomTemplate.name.trim();
      const template = editingCustomTemplate.template.trim();
      
      if (!name) {
        alert('Please enter a diagnosis name');
        return;
      }
      
      if (!template) {
        alert('Please enter a management plan template');
        return;
      }
      
      if (!userPreferences.customizations.managementPlanTemplates) {
        userPreferences.customizations.managementPlanTemplates = {};
      }
      
      userPreferences.customizations.managementPlanTemplates[name] = template;
      showCustomTemplateForm = false;
      editingCustomTemplate = { name: '', template: '' };
      render();
      
      // Show success message
      alert(`Custom template for "${name}" created successfully!`);
    };

    window.cancelCustomTemplate = function() {
      showCustomTemplateForm = false;
      editingCustomTemplate = { name: '', template: '' };
      render();
    };

    window.deleteCustomTemplate = function(diagnosis) {
      if (confirm(`Are you sure you want to delete the template for "${diagnosis}"?`)) {
        if (userPreferences.customizations.managementPlanTemplates) {
          delete userPreferences.customizations.managementPlanTemplates[diagnosis];
          render();
        }
      }
    };

    window.toggleCustomROSVisibility = function(idx) {
      if (!userPreferences.customizations.customROS) {
        userPreferences.customizations.customROS = [];
      }
      userPreferences.customizations.customROS[idx].visible = !userPreferences.customizations.customROS[idx].visible;
      render();
    };

    window.toggleCustomROSRedFlag = function(idx) {
      if (!userPreferences.customizations.customROS) {
        userPreferences.customizations.customROS = [];
      }
      userPreferences.customizations.customROS[idx].redFlag = !userPreferences.customizations.customROS[idx].redFlag;
      render();
    };

    window.toggleCustomExamVisibility = function(idx) {
      if (!userPreferences.customizations.customExam) {
        userPreferences.customizations.customExam = [];
      }
      userPreferences.customizations.customExam[idx].visible = !userPreferences.customizations.customExam[idx].visible;
      render();
    };

    window.toggleCustomExamRedFlag = function(idx) {
      if (!userPreferences.customizations.customExam) {
        userPreferences.customizations.customExam = [];
      }
      userPreferences.customizations.customExam[idx].redFlag = !userPreferences.customizations.customExam[idx].redFlag;
      render();
    };

    window.saveCustomizations = async function() {
      try {
        await saveUserPreferences(userPreferences);
        alert('Customizations saved successfully!');
        closeConfigureModal();
      } catch (error) {
        alert('Error saving customizations: ' + error.message);
      }
    };

    // Silent save for auto-save during reordering (no alerts, no modal close)
    async function saveCustomizationsSilent() {
      try {
        console.log('Saving customizations silently...');
        await saveUserPreferences(userPreferences);
        console.log('Customizations saved successfully');
      } catch (error) {
        console.error('Error auto-saving customizations:', error);
        
        // Show specific error message
        let errorMsg = 'Warning: Failed to save changes to cloud database.\n\n';
        
        if (error.message && error.message.includes('Session expired')) {
          errorMsg += 'Your session has expired.\n\n';
          errorMsg += '⚠️ IMPORTANT: Changes are saved locally but NOT synced to other devices.\n\n';
          errorMsg += 'To fix: Sign out and sign in again, then re-import your changes.';
        } else if (error.message && error.message.includes('Not authenticated')) {
          errorMsg += 'You are not logged in.\n\n';
          errorMsg += 'Please sign in to save changes across devices.';
        } else {
          errorMsg += 'Changes are saved locally but may not sync to other devices.\n\n';
          errorMsg += 'Error: ' + (error.message || 'Unknown error');
        }
        
        alert(errorMsg);
      }
    }

    async function checkSessionValid() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        
        if (error) {
          console.error('Session check error:', error);
          return false;
        }
        
        if (!session) {
          console.warn('No active session');
          return false;
        }
        
        // Check if token is about to expire (within 5 minutes)
        const expiresAt = session.expires_at;
        const now = Math.floor(Date.now() / 1000);
        const timeUntilExpiry = expiresAt - now;
        
        if (timeUntilExpiry < 300) { // Less than 5 minutes
          console.warn('Session expiring soon');
          // Try to refresh
          const { error: refreshError } = await supabaseClient.auth.refreshSession();
          if (refreshError) {
            console.error('Failed to refresh session:', refreshError);
            return false;
          }
          console.log('Session refreshed successfully');
        }
        
        return true;
      } catch (error) {
        console.error('Error checking session:', error);
        return false;
      }
    }

    window.resetToDefaults = function() {
      if (confirm('Reset all customizations to defaults? This cannot be undone.')) {
        userPreferences.customizations = {
          presentations: {},
          ros: {},
          exam: {}
        };
        initializeDefaultCustomizations();
        render();
      }
    };

    window.exportConfig = function() {
      const config = {
        version: "2.0",
        userPreferences: userPreferences,
        exportDate: new Date().toISOString()
      };
      const json = JSON.stringify(config, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `clinical-tool-config-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      alert('Configuration exported successfully!');
    };

    window.importConfig = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        try {
          const text = await file.text();
          const config = JSON.parse(text);
          
          if (config.version && config.userPreferences) {
            await saveUserPreferences(config.userPreferences);
            alert('Configuration imported successfully! Refreshing...');
            location.reload();
          } else {
            alert('Invalid configuration file format.');
          }
        } catch (error) {
          alert('Error importing configuration: ' + error.message);
        }
      };
      input.click();
    };

    function showSaveStatus() {
      const status = document.getElementById('save-status');
      if (status) {
        status.textContent = '💾 Saving locally...';
        setTimeout(() => {
          status.textContent = '✅ Patient data saved locally (auto-clears at midnight)';
        }, 500);
      }
    }

    // ============================================================================
    // RENDER
    // ============================================================================

    function render() {
      const root = document.getElementById('root');
      
      // Capture which presentation details are currently open
      if (configureModalOpen) {
        openPresentationDetails.clear();
        
        // Capture built-in presentations
        const openDetails = root.querySelectorAll('details[data-presentation-idx][open]');
        openDetails.forEach(detail => {
          const idx = detail.getAttribute('data-presentation-idx');
          const presentation = Object.keys(MASTER_FEATURES)[parseInt(idx)];
          if (presentation) {
            openPresentationDetails.add(presentation);
          }
        });
        
        // Capture custom presentations
        const openCustomDetails = root.querySelectorAll('details[data-custom-presentation][open]');
        openCustomDetails.forEach(detail => {
          const presentation = detail.getAttribute('data-custom-presentation');
          if (presentation) {
            openPresentationDetails.add(presentation);
          }
        });
      }
      
      if (!currentUser) {
        root.innerHTML = LoginScreen();
      } else {
        root.innerHTML = AppScreen();
      }
    }

    // ============================================================================
    // START APP
    // ============================================================================

    initialize();
  </script>
</body>
</html>
