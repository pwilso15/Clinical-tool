<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Tool - Modular Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #f8fafc;
    }
    .report-output {
      white-space: pre-wrap;
      font-family: system-ui, sans-serif;
      line-height: 1.45;
    }
  </style>
</head>
<body class="bg-slate-50">
  <main class="max-w-7xl mx-auto p-4">
<div class="bg-white border rounded-xl p-4 mb-4">
  <h1 class="text-2xl font-bold">
    Clinical Tool – Modular Prototype
  </h1>
  <p class="text-slate-600 mt-2">
    Neuro prototype demonstrating:
  </p>
  <ul class="list-disc pl-6 text-slate-600">
    <li>Normal-by-exception neuro exam</li>
    <li>Structured neuro reporting</li>
    <li>Modular architecture</li>
  </ul>
</div>
<div class="grid lg:grid-cols-2 gap-4">
  <section id="app"></section>
  <section class="bg-white border rounded-xl p-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xl font-semibold">
        Generated Report
      </h2>
      <button
        id="copy-report"
        class="px-3 py-2 rounded bg-slate-900 text-white">
        Copy
      </button>
    </div>
    <div
      id="report"
      class="report-output text-sm"></div>
  </section>
</div>
  </main>
  <script type="module" src="./js/modular/app.js"></script>
</body>
</html>
